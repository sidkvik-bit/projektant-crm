# Po merge do develop aplikuje nové migrace na DEV databázi (Supabase "ProjektantCRM - DEV").
# Klíče jsou v prostředí "dev-db", které smí použít jen větev develop — workflow z jiné větve
# se k nim nedostane.
name: db-migrate
on:
  push:
    branches: [develop]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: dev-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kssmlolcgzougrxfuihe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Náhled — co se aplikuje
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" --dry-run
      - run: supabase db push --remote="$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
