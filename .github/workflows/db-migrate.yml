# Po merge do develop aplikuje nové migrace na DEV databázi (Supabase "ProjektantCRM - DEV").
# Heslo je v prostředí "dev-db", které smí použít jen větev develop — workflow z jiné větve
# se k němu nedostane. Připojení jde přes pooler: GitHub runnery nemají IPv6, přímá adresa
# databáze je jen IPv6.
name: db-migrate
on:
  push:
    branches: [develop]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: dev-db
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      POOLER_USER: postgres.kssmlolcgzougrxfuihe
      POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com:5432
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Připojení k databázi
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::Chybí secret SUPABASE_DB_PASSWORD v prostředí dev-db"; exit 1; fi
          PW=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          echo "::add-mask::$PW"
          echo "DB_URL=postgresql://$POOLER_USER:$PW@$POOLER_HOST/postgres" >> "$GITHUB_ENV"
      - name: Náhled — co se aplikuje
        run: supabase db push --db-url "$DB_URL" --dry-run
      - run: supabase db push --db-url "$DB_URL"
